apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cannabis-network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the nginx ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution (kube-dns / CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL (Azure private endpoint)
    - ports:
        - protocol: TCP
          port: 5432
    # HTTPS (Azure Blob Storage, Sentry, IT Assets API)
    - ports:
        - protocol: TCP
          port: 443
    # SMTP (mail relay)
    - ports:
        - protocol: TCP
          port: 587
